plugins {
    id 'com.android.application'
}

def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')

def admobValue = { String name, String fallback ->
    def envValue = System.getenv(name)
    if (envValue != null && !envValue.trim().isEmpty()) return envValue.trim()
    def propValue = project.findProperty(name)
    if (propValue != null && !propValue.toString().trim().isEmpty()) return propValue.toString().trim()
    return fallback
}

def sampleAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'
def admobAppId = admobValue('ADMOB_APP_ID', sampleAdmobAppId)
def admobRewardedId = admobValue('ADMOB_REWARDED_ID', 'ca-app-pub-3940256099942544/5224354917')
def admobInterstitialId = admobValue('ADMOB_INTERSTITIAL_ID', 'ca-app-pub-3940256099942544/1033173712')
def admobTestMode = admobAppId == sampleAdmobAppId

def releaseStorePath = System.getenv('KEYKII_UPLOAD_STORE_FILE')
def releaseStorePassword = System.getenv('KEYKII_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('KEYKII_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('KEYKII_UPLOAD_KEY_PASSWORD')
def releaseEnvSigningReady =
        releaseStorePath != null && !releaseStorePath.trim().isEmpty() &&
        releaseStorePassword != null && !releaseStorePassword.trim().isEmpty() &&
        releaseKeyAlias != null && !releaseKeyAlias.trim().isEmpty() &&
        releaseKeyPassword != null && !releaseKeyPassword.trim().isEmpty() &&
        file(releaseStorePath).exists()

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream {
        keystoreProperties.load(it)
    }
}

android {
    namespace 'com.keykii.neo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.keykii.neo'
        minSdk 23
        targetSdk 35
        versionCode 166
        versionName '2.57.4'
        testInstrumentationRunner 'com.keykii.neo.NeoRendererAudit'
        manifestPlaceholders = [ADMOB_APP_ID: admobAppId]
        buildConfigField 'String', 'ADMOB_REWARDED_ID', '"'+admobRewardedId+'"'
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"'+admobInterstitialId+'"'
        buildConfigField 'boolean', 'ADMOB_TEST_MODE', admobTestMode.toString()
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.keykii/keykii-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (releaseEnvSigningReady) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            if (releaseEnvSigningReady || keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}




dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}

// AndroidX is enabled in gradle.properties for ML Kit.
