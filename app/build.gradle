plugins {
    id 'com.android.application'
}

def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream {
        keystoreProperties.load(it)
    }
}

android {
    namespace 'com.keykii.neo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.keykii.neo'
        minSdk 23
        targetSdk 35
        versionCode 153
        versionName '2.54.2'
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.keykii/keykii-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}




dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}

// AndroidX is enabled in gradle.properties for ML Kit.
