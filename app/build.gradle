plugins {
    id 'com.android.application'
}

def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream {
        keystoreProperties.load(it)
    }
}

android {
    namespace 'com.keykii.neo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.keykii.neo'
        minSdk 23
        targetSdk 35
        versionCode 138
        versionName '2.45.0'
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.keykii/keykii-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}


def keykiiGeneratedFontAssets =
        file("$buildDir/generated/keykii-font-assets")

def keykiiFontDownloads = [
        "fonts/fredoka.ttf":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth%2Cwght%5D.ttf",
        "fonts/dynapuff.ttf":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/dynapuff/DynaPuff%5Bwdth%2Cwght%5D.ttf",
        "fonts/rubik_bubbles.ttf":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/rubikbubbles/RubikBubbles-Regular.ttf",
        "fonts/patrick_hand.ttf":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/patrickhand/PatrickHand-Regular.ttf",
        "fonts/lobster.ttf":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/lobster/Lobster-Regular.ttf",
        "fonts/bungee.ttf":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/bungee/Bungee-Regular.ttf",
        "fonts/press_start_2p.ttf":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/pressstart2p/PressStart2P-Regular.ttf",
        "fonts/cinzel_decorative.ttf":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzeldecorative/CinzelDecorative-Regular.ttf",
        "font_licenses/fredoka-OFL.txt":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/OFL.txt",
        "font_licenses/dynapuff-OFL.txt":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/dynapuff/OFL.txt",
        "font_licenses/rubik-bubbles-OFL.txt":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/rubikbubbles/OFL.txt",
        "font_licenses/patrick-hand-OFL.txt":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/patrickhand/OFL.txt",
        "font_licenses/lobster-OFL.txt":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/lobster/OFL.txt",
        "font_licenses/bungee-OFL.txt":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/bungee/OFL.txt",
        "font_licenses/press-start-2p-OFL.txt":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/pressstart2p/OFL.txt",
        "font_licenses/cinzel-decorative-OFL.txt":
                "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzeldecorative/OFL.txt"
]

tasks.register("prepareKeyKiiFonts") {
    outputs.dir(keykiiGeneratedFontAssets)

    doLast {
        keykiiFontDownloads.each { relativePath, sourceUrl ->
            File target =
                    new File(
                            keykiiGeneratedFontAssets,
                            relativePath
                    )

            if(
                    target.exists() &&
                    target.length()>256
            ) {
                return
            }

            target.parentFile.mkdirs()

            java.net.URLConnection connection =
                    new java.net.URL(sourceUrl)
                            .openConnection()

            connection.setConnectTimeout(20000)
            connection.setReadTimeout(30000)

            connection.getInputStream().withCloseable { input ->
                target.withOutputStream { output ->
                    output << input
                }
            }
        }
    }
}

android.sourceSets.main.assets.srcDir(
        keykiiGeneratedFontAssets
)

tasks.named("preBuild").configure {
    dependsOn("prepareKeyKiiFonts")
}


dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}

