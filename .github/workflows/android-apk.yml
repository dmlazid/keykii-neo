name: Build KeyKii APK

on:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'theme-assets/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
      KEYKII_UPLOAD_STORE_FILE: ${{ github.workspace }}/.play-signing/keykii-upload.jks
      KEYKII_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYKII_UPLOAD_STORE_PASSWORD }}
      KEYKII_UPLOAD_KEY_ALIAS: ${{ secrets.KEYKII_UPLOAD_KEY_ALIAS }}
      KEYKII_UPLOAD_KEY_PASSWORD: ${{ secrets.KEYKII_UPLOAD_KEY_PASSWORD }}
      KEYKII_UPLOAD_KEYSTORE_B64: ${{ secrets.KEYKII_UPLOAD_KEYSTORE_B64 }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Restore stable KeyKii signing key
        uses: actions/cache@v4
        with:
          path: ~/.keykii/keykii-debug.keystore
          key: keykii-neo-stable-debug-keystore-v1

      - name: Create stable signing key if needed
        shell: bash
        run: |
          mkdir -p "$HOME/.keykii"
          if [ ! -f "$HOME/.keykii/keykii-debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.keykii/keykii-debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -keysize 2048               -validity 10000               -noprompt
          fi
          mkdir -p "$HOME/.android"
          cp "$HOME/.keykii/keykii-debug.keystore" "$HOME/.android/debug.keystore"

      - name: Restore optional Play upload key
        if: ${{ env.KEYKII_UPLOAD_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.play-signing"
          printf '%s' "$KEYKII_UPLOAD_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/.play-signing/keykii-upload.jks"
          chmod 600 "$GITHUB_WORKSPACE/.play-signing/keykii-upload.jks"

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Rasterize committed illustrated theme assets
        run: |
          python3 -m pip install --disable-pip-version-check pillow cairosvg
          python3 scripts/rasterize_theme_assets_248.py

      - name: Audit theme geometry
        run: bash tests/run-theme-audit.sh

      - name: Build APK and Android test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 :app:assembleDebug
          ./gradlew --no-daemon --max-workers=1 :app:assembleDebugAndroidTest

      - name: Build Play App Bundle
        run: |
          ./gradlew --no-daemon --max-workers=1 :app:bundleRelease

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify native renderer and capture all families
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.keykii.neo.test/com.keykii.neo.NeoRendererAudit > renderer-audit.log
            cat renderer-audit.log
            grep -q THEME_V2_AUDIT_PASS renderer-audit.log
            adb pull /sdcard/Android/data/com.keykii.neo/files/theme-v2-audit renderer-audit

      - name: Upload renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Theme-Renderer-V2-Audit
          path: |
            renderer-audit/
            renderer-audit.log
          if-no-files-found: warn

      - name: Package APK, AAB, audit and checksums
        id: package
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)
          APK_NAME="KeyKii-Neo-${VERSION}.apk"
          AAB_NAME="KeyKii-Neo-${VERSION}-Play.aab"
          AUDIT_NAME="Theme-Renderer-V2-Audit-${VERSION}.zip"
          SHA_NAME="KeyKii-Neo-${VERSION}-SHA256.txt"
          RELEASE_DIR="release-files/${VERSION}"

          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          cp app/build/outputs/bundle/release/app-release.aab "${AAB_NAME}"

          rm -f "${AUDIT_NAME}"
          AUDIT_INPUTS=()
          [ -d renderer-audit ] && AUDIT_INPUTS+=(renderer-audit)
          [ -f renderer-audit.log ] && AUDIT_INPUTS+=(renderer-audit.log)
          if [ ${#AUDIT_INPUTS[@]} -gt 0 ]; then
            zip -qr "${AUDIT_NAME}" "${AUDIT_INPUTS[@]}"
          else
            touch "${AUDIT_NAME}"
          fi

          sha256sum "${APK_NAME}" "${AAB_NAME}" "${AUDIT_NAME}" > "${SHA_NAME}"

          mkdir -p "${RELEASE_DIR}"
          cp "${APK_NAME}" "${AAB_NAME}" "${AUDIT_NAME}" "${SHA_NAME}" "${RELEASE_DIR}/"

          printf '%s\n' \
            "# KeyKii Neo ${VERSION}" \
            "" \
            "Everything for this update is kept together in this folder:" \
            "" \
            "- ${APK_NAME} — install/test on Android" \
            "- ${AAB_NAME} — upload to Google Play Console" \
            "- ${SHA_NAME} — SHA-256 checksums" \
            "- ${AUDIT_NAME} — renderer/device audit evidence" \
            > "${RELEASE_DIR}/README.md"

          printf '%s\n' \
            "# KeyKii Neo release files" \
            "" \
            "All future KeyKii build downloads are kept in this one GitHub folder." \
            "" \
            "**Latest:** [${VERSION}](./${VERSION}/)" \
            "" \
            "Each version folder contains the APK, Play AAB, SHA-256 file, renderer audit ZIP and a short README." \
            > release-files/README.md

          if [ -f "$GITHUB_WORKSPACE/.play-signing/keykii-upload.jks" ]; then
            echo "Play bundle was signed in CI with the configured upload key."
          else
            echo "Play bundle is unsigned because upload-key secrets are not configured yet."
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "aab_name=${AAB_NAME}" >> "$GITHUB_OUTPUT"
          echo "audit_name=${AUDIT_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_name=${SHA_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_dir=${RELEASE_DIR}" >> "$GITHUB_OUTPUT"

      - name: Save release files in one GitHub folder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p old-versions release-files
          APK_NAME="${{ steps.package.outputs.apk_name }}"
          RELEASE_DIR="${{ steps.package.outputs.release_dir }}"

          # Keep the root APK for old download links, but put the complete
          # release package in release-files/<version>/ from now on.
          shopt -s nullglob
          for file in KeyKii-Neo*.apk; do
            if [ "$file" != "$APK_NAME" ]; then
              git mv -f "$file" "old-versions/$file"
            fi
          done

          git add -A old-versions "$APK_NAME" release-files app/src/main/res/drawable-nodpi/theme_ill_bg_*.webp

          if git diff --cached --quiet; then
            echo "Release folder is already current."
          else
            git commit -m "Package KeyKii Neo ${{ steps.package.outputs.version }} release files [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KeyKii-Neo-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.apk_name }}
          if-no-files-found: error


      - name: Upload Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: KeyKii-Neo-${{ steps.package.outputs.version }}-Play-AAB
          path: ${{ steps.package.outputs.aab_name }}
          if-no-files-found: error
