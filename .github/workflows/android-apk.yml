name: Build KeyKii APK

on:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'scripts/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Restore stable KeyKii signing key
        uses: actions/cache@v4
        with:
          path: ~/.keykii/keykii-debug.keystore
          key: keykii-neo-stable-debug-keystore-v1

      - name: Create stable signing key if needed
        shell: bash
        run: |
          mkdir -p "$HOME/.keykii"
          if [ ! -f "$HOME/.keykii/keykii-debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.keykii/keykii-debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -keysize 2048               -validity 10000               -noprompt
          fi
          mkdir -p "$HOME/.android"
          cp "$HOME/.keykii/keykii-debug.keystore" "$HOME/.android/debug.keystore"

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Generate illustrated theme assets
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 scripts/generate_theme_assets_247.py

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK with KeyKii version
        id: package
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          APK_NAME="KeyKii-Neo-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Save latest APK and archive older builds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p old-versions
          APK_NAME="${{ steps.package.outputs.apk_name }}"

          # Keep the newly built APK in the repository root.
          # Move every older KeyKii APK into one archive folder.
          shopt -s nullglob
          for file in KeyKii-Neo*.apk; do
            if [ "$file" != "$APK_NAME" ]; then
              git mv -f "$file" "old-versions/$file"
            fi
          done

          git add -A old-versions "$APK_NAME" app/src/main/res/drawable-nodpi/theme_ill_bg_*.webp

          if git diff --cached --quiet; then
            echo "Latest APK is already current and older builds are already archived."
          else
            git commit -m "Build KeyKii Neo ${{ steps.package.outputs.version }} APK [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KeyKii-Neo-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.apk_name }}
          if-no-files-found: error
