name: Verify KeyKii APK Signatures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-apk-signatures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download repository APKs
        run: |
          curl -L --fail -o keykii-2.10.5.apk https://raw.githubusercontent.com/dmlazid/keykii-neo/main/KeyKii-Neo-2.10.5.apk
          curl -L --fail -o keykii-2.10.6.apk https://raw.githubusercontent.com/dmlazid/keykii-neo/main/KeyKii-Neo-2.10.6.apk
      - name: Print signing certificates
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          echo "=== 2.10.5 ==="
          "$APKSIGNER" verify --print-certs keykii-2.10.5.apk
          echo "=== 2.10.6 ==="
          "$APKSIGNER" verify --print-certs keykii-2.10.6.apk
